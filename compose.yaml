services:
  airflow:
    image: apache/airflow:2.10.5-python3.9
    ports:
      - "8080:8080"
    volumes:
      # Edit DAGs on your machine; picked up by the container
      - /home/jayesh_mhaske_searce_com/aramex/airflowBQDags/dags:/opt/airflow/dags
      # Task logs on your machine
      - ./airflow/logs:/opt/airflow/logs
      # Metadata DB (users, connections, variables, run history) on your machine
      - ./airflow/data:/opt/airflow/data
      # Mount a file to a specific filepath in the container
      - ~/.config/gcloud/application_default_credentials.json:/home/airflow/.config/gcloud/application_default_credentials.json
    environment:
      AIRFLOW_HOME: /opt/airflow
      # Four slashes = absolute path for SQLAlchemy/SQLite
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/data/airflow.db
      AIRFLOW_CONN_GOOGLE_CLOUD_DEFAULT: 'google-cloud-platform://'
      GOOGLE_CLOUD_PROJECT: prj-drgfly-dev-sp-01
      SP_DATASET_ID: bq_ds_dev_euw2_store_procedure
      TARGET_DATASET_ID: bq_ds_dev_euw2_oceania_cube_gold_1
      PROJECT_ID: prj-drgfly-dev-sp-01
    command: airflow standalone
